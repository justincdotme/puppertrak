services:
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-puppertrak}
            MYSQL_USER: ${DB_USERNAME:-puppertrak}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        ports:
            - "${DB_FORWARD_HOST:-127.0.0.1}:${DB_FORWARD_PORT:-3306}:3306"
        volumes:
            - ./docker/data/mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s
        networks:
            - app-network

    # PHP services read all Laravel configuration from the bind-mounted .env.
    # Do not add config as `environment:` here: OS-level env vars override
    # .env and .env.testing, which breaks `php artisan test`.
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                PUPPERTRAK_UID: ${PUPPERTRAK_UID:-1000}
                PUPPERTRAK_GID: ${PUPPERTRAK_GID:-1000}
        restart: unless-stopped
        working_dir: /var/www/html
        user: "${PUPPERTRAK_UID:-1000}:${PUPPERTRAK_GID:-1000}"
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    migrate:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                PUPPERTRAK_UID: ${PUPPERTRAK_UID:-1000}
                PUPPERTRAK_GID: ${PUPPERTRAK_GID:-1000}
        restart: "no"
        working_dir: /var/www/html
        user: "${PUPPERTRAK_UID:-1000}:${PUPPERTRAK_GID:-1000}"
        volumes:
            - .:/var/www/html
        command: php artisan migrate --force
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    worker:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                PUPPERTRAK_UID: ${PUPPERTRAK_UID:-1000}
                PUPPERTRAK_GID: ${PUPPERTRAK_GID:-1000}
        restart: unless-stopped
        working_dir: /var/www/html
        user: "${PUPPERTRAK_UID:-1000}:${PUPPERTRAK_GID:-1000}"
        volumes:
            - .:/var/www/html
        command: php artisan queue:work
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - app-network

    scheduler:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                PUPPERTRAK_UID: ${PUPPERTRAK_UID:-1000}
                PUPPERTRAK_GID: ${PUPPERTRAK_GID:-1000}
        restart: unless-stopped
        working_dir: /var/www/html
        user: "${PUPPERTRAK_UID:-1000}:${PUPPERTRAK_GID:-1000}"
        volumes:
            - .:/var/www/html
        command: php artisan schedule:work
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - app-network

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        restart: unless-stopped
        environment:
            SERVER_NAME: ${NGINX_SERVER_NAME:-_}
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - .:/var/www/html
            - ../certs:/etc/nginx/certs:ro
        depends_on:
            - app
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
